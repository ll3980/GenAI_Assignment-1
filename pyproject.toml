[project]
name = "sps-genai-assignment1"
version = "1.0.0"
description = "Module 3 FastAPI bigram generator extended with Module 2 spaCy embeddings"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "spacy==3.8.16",
    "en-core-web-lg",
]

[tool.uv]
package = false

[tool.uv.sources]
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==8.4.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
